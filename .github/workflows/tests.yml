name: CPU regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt -e .
      - run: python -m pytest -q
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q xlayer_telemetry examples
          git ls-files -z '*.sh' | xargs -0 -r -n 1 bash -n
