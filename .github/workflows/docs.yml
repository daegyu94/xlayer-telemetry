name: Documentation

on:
  push:
    branches: [main]
    paths: ["README.md", "**/README.md", "docs/**", "requirements-docs.txt", "requirements.txt", "tests/test_documentation*.py", "scripts/docs.sh", "scripts/render_diagrams.py", "scripts/docs-browser/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["README.md", "**/README.md", "docs/**", "requirements-docs.txt", "requirements.txt", "tests/test_documentation*.py", "scripts/docs.sh", "scripts/render_diagrams.py", "scripts/docs-browser/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements.txt
      - run: python -m pip install -r requirements-docs.txt -r requirements.txt
      - name: Check README links and documentation regressions
        run: python -m pytest -q tests/test_documentation_links.py tests/test_documentation_diagrams.py
      - name: Verify D2 sources and committed SVGs
        run: python scripts/render_diagrams.py --install --check
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/docs-browser/package-lock.json
      - name: Install documentation browser checks
        run: |
          npm ci --prefix scripts/docs-browser
          ./scripts/docs-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build and check internal references
        run: python -m sphinx -n -W --keep-going -b html docs artifacts/docs-site
      - name: Check diagram geometry and rendered documentation
        run: XLAYER_DOCS_SITE=artifacts/docs-site npm test --prefix scripts/docs-browser
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/docs-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
