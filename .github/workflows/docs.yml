name: Documentation

on:
  push:
    branches: [main]
    paths: ["docs/**", "requirements-docs.txt", "scripts/docs.sh", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "requirements-docs.txt", "scripts/docs.sh", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - name: Build and check internal references
        run: python -m sphinx -n -W --keep-going -b html docs artifacts/docs-site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/docs-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
