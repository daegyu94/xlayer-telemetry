name: Optional Grafana App PoC

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grafana-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.detect.outputs.app }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: detect
        name: Detect App changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$BASE_SHA" =~ ^0+$ || -z "$BASE_SHA" ]]; then
            app=true
          else
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"
            if grep -Eq '^(grafana/xlayer-app/|examples/dashboards/|xlayer_telemetry/|config/|pyproject\.toml$|requirements\.txt$|scripts/(dashboard_views|provision_dashboards)\.py$|\.github/workflows/grafana-app\.yml$)' "$RUNNER_TEMP/changed-paths"; then
              app=true
            else
              app=false
            fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        demo: [single-worker, multi-worker, multi-job, scenario-basics, scenario-recovery]
    defaults:
      run:
        working-directory: grafana/xlayer-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: grafana/xlayer-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Package unsigned development App
        run: python scripts/package_plugin.py --output ../../artifacts/grafana-app-package
      - name: Install CPU demo / browser test dependencies
        run: |
          python -m pip install -e ../.. playwright==1.56.0
          python -m playwright install --with-deps chromium
          # Korean explanations need real glyphs in headless screenshots.
          sudo apt-get install -y fonts-noto-cjk
      - name: Cache pinned release archives
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/xlayer-grafana-tools/*.tar.gz
            ${{ runner.temp }}/xlayer-grafana-tools/*.zip
          key: xlayer-grafana-app-linux-amd64-releases-v2-${{ hashFiles('xlayer_telemetry/grafana_release.py', 'grafana/xlayer-app/scripts/install_ci_tools.py') }}
      - name: Install checksum-verified demo tools
        run: python scripts/install_ci_tools.py --output "$RUNNER_TEMP/xlayer-grafana-tools"
      - name: Actual Grafana / Scenes browser journey
        if: ${{ !startsWith(matrix.demo, 'scenario-') }}
        run: |
          demo_args=()
          if [[ "${{ matrix.demo }}" == "multi-worker" ]]; then
            demo_args=(--multi-worker)
          elif [[ "${{ matrix.demo }}" == "multi-job" ]]; then
            demo_args=(--multi-job --completed-comparisons 1)
          fi
          python scripts/ci_demo.py \
            --tools "$RUNNER_TEMP/xlayer-grafana-tools" \
            --state "$RUNNER_TEMP/xlayer-grafana-state" \
            --output ../../artifacts/grafana-app-browser "${demo_args[@]}"
      - name: Scenario-driven product regression
        if: ${{ startsWith(matrix.demo, 'scenario-') }}
        run: |
          scenarios=(normal slow-rollout recorded-error storage-regression)
          if [[ "${{ matrix.demo }}" == "scenario-recovery" ]]; then
            scenarios=(multi-job partial-telemetry async-replicas)
          fi
          python scripts/ci_scenarios.py \
            --tools "$RUNNER_TEMP/xlayer-grafana-tools" \
            --state "$RUNNER_TEMP/xlayer-scenario-state" \
            --output ../../artifacts/grafana-app-browser --scenarios "${scenarios[@]}"
      - name: Preserve bounded browser reports and unsigned package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlayer-grafana-app-poc-${{ matrix.demo }}
          path: |
            artifacts/grafana-app-browser/**/*.json
            artifacts/grafana-app-browser/**/*.png
            artifacts/grafana-app-browser/**/*.log
            artifacts/grafana-app-package/*.zip
            artifacts/grafana-app-package/*.sha256
          retention-days: 7
          if-no-files-found: warn

  required:
    name: Grafana App required
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Report App gate result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APP_CHANGED: ${{ needs.changes.outputs.app }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          [[ "$CHANGES_RESULT" == success ]] || exit 1
          if [[ "$APP_CHANGED" == true ]]; then
            [[ "$BUILD_RESULT" == success ]]
          else
            [[ "$BUILD_RESULT" == skipped ]]
          fi
