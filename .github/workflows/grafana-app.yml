name: Optional Grafana App PoC

on:
  pull_request:
    paths: ["grafana/xlayer-app/**", "examples/dashboards/**", "xlayer_telemetry/**", "config/**", "pyproject.toml", "requirements.txt", "scripts/dashboard_views.py", "scripts/provision_dashboards.py", ".github/workflows/grafana-app.yml"]
  push:
    branches: [main]
    paths: ["grafana/xlayer-app/**", "examples/dashboards/**", "xlayer_telemetry/**", "config/**", "pyproject.toml", "requirements.txt", "scripts/dashboard_views.py", "scripts/provision_dashboards.py", ".github/workflows/grafana-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grafana-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        demo: [single-worker, multi-worker, multi-job]
    defaults:
      run:
        working-directory: grafana/xlayer-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: grafana/xlayer-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Package unsigned development App
        run: python scripts/package_plugin.py --output ../../artifacts/grafana-app-package
      - name: Install CPU demo / browser test dependencies
        run: |
          python -m pip install -e ../.. playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Cache pinned release archives
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/xlayer-grafana-tools/*.tar.gz
            ${{ runner.temp }}/xlayer-grafana-tools/*.zip
          key: xlayer-grafana-app-linux-amd64-grafana12.1.0-prometheus3.5.0-loki3.7.3-v1
      - name: Install checksum-verified demo tools
        run: python scripts/install_ci_tools.py --output "$RUNNER_TEMP/xlayer-grafana-tools"
      - name: Actual Grafana / Scenes browser journey
        run: |
          demo_args=()
          if [[ "${{ matrix.demo }}" == "multi-worker" ]]; then
            demo_args=(--multi-worker)
          elif [[ "${{ matrix.demo }}" == "multi-job" ]]; then
            demo_args=(--multi-job --completed-comparisons 1)
          fi
          python scripts/ci_demo.py \
            --tools "$RUNNER_TEMP/xlayer-grafana-tools" \
            --state "$RUNNER_TEMP/xlayer-grafana-state" \
            --output ../../artifacts/grafana-app-browser "${demo_args[@]}"
      - name: Preserve bounded browser reports and unsigned package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlayer-grafana-app-poc-${{ matrix.demo }}
          path: |
            artifacts/grafana-app-browser/**/*.json
            artifacts/grafana-app-browser/**/*.png
            artifacts/grafana-app-browser/**/*.log
            artifacts/grafana-app-package/*.zip
            artifacts/grafana-app-package/*.sha256
          retention-days: 7
          if-no-files-found: warn
