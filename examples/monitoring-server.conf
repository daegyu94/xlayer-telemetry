# Copy this local Bash file and edit it for your monitoring host.
TOOLS_DIR="$HOME/telemetry/tools"
OUTPUT_DIR="$HOME/telemetry/state/server"
CLUSTER_NAME='training-cluster'
TELEMETRY_TARGETS='gpu-local=127.0.0.1'
DEMO_LIVE=0

# Turn on optional features here and reuse this file on every server restart.
ENABLE_ALERTS=0
ALERT_MOUNTPOINT='/'
ALERT_FREE_PERCENT=10
ENABLE_LOGS=0
LOKI_LISTEN_ADDR='127.0.0.1'

# Set these paths and targets when the related sources are installed.
TELEMETRY_SOURCES_FILE=''
STORAGE_SYSTEM='local'
STORAGE_TARGETS=''

# Dashboard Color links: Dark / Sapphire / Desert (independent from View).
# Grafana profile > Change theme also supports other native themes.
# Extra themes are experimental; set an empty toggle list to hide the picker extras.
GF_FEATURE_TOGGLES_ENABLE=''  # optional: extraThemes (experimental)
GF_USERS_DEFAULT_THEME='light'  # also: sapphiredusk, gloom, desertbloom, tron, gildedgrove, light, system

# Per-scrape guardrails; exceeding a limit fails that scrape (check Prometheus Targets).
PROMETHEUS_SAMPLE_LIMIT=100000
PROMETHEUS_TARGET_LIMIT=1024
PROMETHEUS_BODY_SIZE_LIMIT_MB=16
NATIVE_SCRAPE_INTERVAL_SECONDS=5
NATIVE_SCRAPE_TIMEOUT_SECONDS=4
