# Copy this local Bash file and edit it for your monitoring host.
TOOLS_DIR="$HOME/telemetry/tools"
OUTPUT_DIR="$HOME/telemetry/state/server"
CLUSTER_NAME='training-cluster'
TELEMETRY_TARGETS='gpu-local=127.0.0.1'
DEMO_LIVE=0

# Turn on optional features here and reuse this file on every server restart.
ENABLE_ALERTS=0
ALERT_MOUNTPOINT='/'
ALERT_FREE_PERCENT=10
ENABLE_LOGS=0
LOKI_LISTEN_ADDR='127.0.0.1'

# Set these paths and targets when the related sources are installed.
TELEMETRY_SOURCES_FILE=''
STORAGE_SYSTEM='local'
STORAGE_TARGETS=''

# Grafana 12.1 native themes: profile menu > Change theme.
# Extra themes are experimental; set an empty toggle list to hide the picker extras.
GF_FEATURE_TOGGLES_ENABLE='extraThemes'
GF_USERS_DEFAULT_THEME='dark'  # also: sapphiredusk, gloom, desertbloom, tron, gildedgrove, light, system
