<div class="contextbar"><div class="filter"><label for="cluster-select">Cluster</label><select id="cluster-select"><option value="training-poc">training-poc</option><option value="lab-synthetic">lab-synthetic</option></select></div><div class="filter focus"><label for="run-select">Run</label><select id="run-select"><option value="demo-llama">demo-llama</option><option value="demo-qwen">demo-qwen</option><option value="demo-deepseek">demo-deepseek</option></select></div><div class="filter"><label for="step-select">Step</label><select id="step-select"><option value="127">127</option><option value="126">126</option><option value="125">125</option></select></div><div class="filter"><label for="node-select">Resource</label><select id="node-select"><option value="All">All nodes</option><option value="gpu-0">gpu-0</option><option value="gpu-1">gpu-1</option><option value="ds-0">ds-0</option><option value="ds-1">ds-1</option><option value="mds-0">mds-0</option></select></div><div class="spacer"></div><div class="filter"><label for="time-select">Time</label><select id="time-select"><option value="30m">Last 30 min</option><option value="1h">Last 1 hour</option><option value="6h">Last 6 hours</option></select></div><button class="smallbtn" id="reset-button" title="미리보기 필터 초기화">↺ Reset</button></div>
<main class="page" id="page"></main>
</div></div>
<div id="modal-root"></div>
<script>
'use strict';
const icons={overview:'◫',analyze:'▦',investigate:'◎',timeline:'≋',deep:'◈',infra:'⬡',logs:'☷',start:'◉',stage:'▥',compute:'⌁',storage:'▤',signals:'◷',summary:'☰'};
const NAV=[{title:'WORKSPACE',items:[['overview','Overview'],['analyze','Analyze'],['investigate','Investigate'],['timeline','Timeline'],['deep','Deep Dive'],['infra','Infrastructure'],['logs','Logs & Events']]},{title:'NATIVE DASHBOARDS',items:[['start','Start Here'],['stage','Stage Correlation'],['summary','Bottleneck Summary'],['compute','Compute & Communication'],['storage','Data & Storage'],['signals','Cross-Layer Signals']]}];
const state={page:'overview',run:'demo-llama',step:'127',cluster:'training-poc',node:'All',time:'30m',selectedNode:'gpu-0',detailTab:'Mooncake / KV',evidenceTab:'All evidence',analyzeView:'Matrix',search:'',logLevel:'All',viewMode:'read',chartMetric:'Read / Write',dark:false};
const palette={blue:'#607bbd',teal:'#19948c',amber:'#cb974b',red:'#c66f70',violet:'#9381bd',slate:'#8294a8',cyan:'#57a9b7'};
const sampleProfiles={'demo-llama':{model:'Llama 3.1 · synthetic',time:18.4,reward:.284,throughput:154,rollout:8.4,coverage:84},'demo-qwen':{model:'Qwen 2.5 · synthetic',time:12.6,reward:.317,throughput:181,rollout:5.1,coverage:91},'demo-deepseek':{model:'DeepSeek distill · synthetic',time:16.1,reward:.263,throughput:140,rollout:6.9,coverage:79}};
function icon(key){return `<span style="width:17px;display:inline-block;text-align:center;font-size:16px;line-height:1">${icons[key]||'◦'}</span>`}
function t(label,kind='neutral'){return `<span class="tag ${kind}">${label}</span>`}
function header(title,desc,eyebrow='WORKSPACE',actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function banner(s,cls=''){return `<div class="banner ${cls}"><span class="info">i</span><div>${s}</div></div>`}
function panel(title,desc,body,opts={}){return `<section class="panel ${opts.class||''}"><div class="ph"><div><div class="pt">${title}</div>${desc?`<div class="pd">${desc}</div>`:''}</div><div class="pa">${opts.action||'<span title="Data scope / source available in full implementation">ⓘ</span>'}</div></div><div class="pbody">${body}</div></section>`}
function metric(label,value,unit='',delta='',desc='',tone=''){return `<article class="metric"><div class="m-head"><span>${label}</span><span title="Source and scope should be checked">ⓘ</span></div><div class="m-val">${value}<small>${unit}</small></div><div class="m-bottom"><span>${desc}</span>${delta?`<span class="delta ${tone}">${delta}</span>`:''}</div></article>`}
function grid(cls,arr){return `<div class="grid ${cls}">${arr.join('')}</div>`}
function table(headers,rows,options={}){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr ${row.step?`data-step="${row.step}"`:''} class="${row.step===state.step?'selected':''}">${row.cells.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function spark(seed=0,color=palette.blue){let points=Array.from({length:19},(_,i)=>{const a=Math.sin((i+seed)*.9)*5+Math.cos((i+seed)*.4)*4+i*.23;return `${i*4.5},${21-a*.48}`}).join(' ');return `<svg class="spark" viewBox="0 0 86 26"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function graph(title,series,unit='',opts={}){const W=760,H=opts.H||218,l=35,r=11,top=15,b=28,base=H-b,gw=W-l-r,gh=base-top;let all=series.flatMap(s=>s.values);const max=opts.max||Math.max(...all,1)*1.16;const min=opts.min||0;const Y=v=>base-(v-min)/(max-min||1)*gh;let svg=`<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} - synthetic chart">`;for(let i=0;i<4;i++){let v=min+(max-min)*i/3,y=Y(v);svg+=`<line x1="${l}" y1="${y}" x2="${W-r}" y2="${y}" stroke="var(--edge)" stroke-width="1" stroke-dasharray="3 4"/><text x="${l-8}" y="${y+3}" fill="var(--muted)" text-anchor="end" font-size="10">${Math.abs(v)>100?v.toFixed(0):v.toFixed(1)}</text>`}let ticks=opts.labels||['22:00','22:05','22:10','22:15','22:20','22:25'];ticks.forEach((tick,i)=>svg+=`<text x="${l+i*gw/(ticks.length-1)}" y="${H-8}" fill="var(--muted)" text-anchor="middle" font-size="10">${tick}</text>`);series.forEach((s,si)=>{const pts=s.values.map((v,i)=>[l+i*gw/(s.values.length-1),Y(v)]);const path=pts.map(([x,y],i)=>`${i?'L':'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');if(si===0&&opts.fill!==false){const p=`${path} L${(l+gw).toFixed(1)} ${base} L${l} ${base}Z`;svg+=`<path d="${p}" fill="${s.color}" opacity=".055"/>`}svg+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;pts.filter((p,i)=>i%7===0).forEach(([x,y])=>svg+=`<circle cx="${x}" cy="${y}" r="2.6" fill="${s.color}" stroke="var(--panel)" stroke-width="1.5"/>`)});svg+='</svg>';return `<div class="chartwrap">${svg}</div><div class="chart-foot"><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div><span>${unit||'reported values'} · sample timeline</span></div>`}
function points(base,variation=0,n=24){return Array.from({length:n},(_,i)=>Math.round((base+Math.sin(i*.55+variation)*base*.11+Math.cos(i*1.31+variation)*base*.045+((i>13&&i<18)?base*.23:0))*10)/10)}
function linePanel(title,desc,series,unit='',opts={}){return panel(title,desc,graph(title,series,unit,opts),{action:opts.action})}
function bars(items){return `<div class="stacked">${items.map((r,i)=>`<div><div class="kvrow"><span>${r.name}</span><strong>${r.value}</strong></div><div class="progress ${r.tone||''}"><span style="width:${r.percent}%"></span></div></div>`).join('')}</div>`}
function eventList(){return `<ul class="list">${[['weights.applied','rollout-1 · version 18 · producer reported','22:21:26','✓'],['rollout.generate','span · gpu-1 · explicit SDK boundary','22:21:18','◷'],['mooncake.store','DFS batch · shared client scope','22:21:14','◈'],['checkpoint.save','completed span · trainer','22:20:58','↧']].map(row=>`<li><div class="iconcircle">${row[3]}</div><div style="min-width:0"><div class="list-title">${row[0]}</div><div class="list-detail">${row[1]}</div></div><span class="time">${row[2]}</span></li>`).join('')}</ul>`}
function fullCatalog(title,items){return `<details class="panel-catalog"><summary>▸ &nbsp; More panels & source coverage · ${title} <span class="muted" style="font-weight:450">(${items.length} panel groups)</span></summary><div class="catalog-grid">${items.map(x=>`<div class="catitem">${x}</div>`).join('')}</div><div style="padding:0 17px 12px" class="tiny">목록은 프로젝트의 수집·대시보드 영역을 요약한 디자인 목업입니다. 실제 연결·지원 여부는 버전과 exporter 설정에 따라 달라집니다.</div></details>`}
function goBtn(page,label,primary=false){return `<button class="smallbtn ${primary?'primary':''}" data-go="${page}">${label}</button>`}
function shellNote(){return `<div class="footnote">SYNTHETIC UI DESIGN PREVIEW · 수치와 이벤트는 레이아웃 검토용 예시입니다. Shared resource 메트릭은 Run 사용량 또는 causality를 뜻하지 않습니다. Production에서는 기존 XLayer canonical datasource/query, source scope와 freshness를 재사용해야 합니다.</div>`}
function stepsTable(){return table(['Step / Worker','Duration','Reported rollout','Reward','Boundary','Action'],[['127','trainer · driver','18.4 s','8.4 s','0.284','Approx.'],['126','trainer · driver','11.2 s','5.2 s','0.277','Approx.'],['125','trainer · driver','11.6 s','5.5 s','0.281','Approx.']].map(row=>({step:row[0],cells:[`<b>${row[0]}</b><small>${row[1]}</small>`,`<b>${row[2]}</b>`,row[3],row[4],t(row[5],'neutral'),`<button class="metriclink" data-go="investigate" data-step="${row[0]}">Investigate →</button>`]})))}
function timelineMarkup(opts={}){const lanes=[['Trainer · update',[[1,22,'#607bbd'],[28,13,'#607bbd'],[48,35,'#607bbd']]],['Rollout · worker-0',[[6,31,'#1b8e96'],[43,28,'#1b8e96']]],['Rollout · worker-1',[[8,49,'#1b8e96']]],['Tool / sandbox',[[19,12,'#c39a5e'],[45,10,'#c39a5e']]],['Policy / weight sync',[[68,10,'#9786b7']]],['Storage / checkpoint',[[81,14,'#8b97a7']]]];return `<div class="timeline"><div class="time-axis"><span>0 s</span><span>5 s</span><span>10 s</span><span>15 s</span><span>20 s</span></div>${lanes.map((r,ri)=>`<div class="lane"><div class="lane-name">${r[0]}</div><div class="lane-range">${r[1].map((seg,i)=>`<span class="lane-segment" title="${r[0]} · ${seg[0]/5}s (illustrative)" style="left:${seg[0]}%;width:${seg[1]}%;background:${seg[2]};opacity:${ri===3?.65:.86}"></span>`).join('')}</div></div>`).join('')}</div><div class="chart-foot"><span>solid blocks: recorded spans (illustrative) · no inferred parent chain</span><div class="legend"><span><i style="background:${palette.blue}"></i>Training</span><span><i style="background:${palette.teal}"></i>Rollout</span><span><i style="background:${palette.amber}"></i>Tool</span></div></div>`}
function evidenceItems(filter='All evidence'){let rows=[['Supporting','3FS shared service latency increased','reported p99 max · same producer / window','warn'],['Supporting','Storage device queue elevated','node ds-0 / nvme0n1 · device scope','warn'],['Counter','Network headroom appears available','interface eth2 · path relationship unverified','good'],['Missing','Run → shared 3FS operation attribution','no request-level link / unknown ownership','neutral'],['Missing','Service → SSD mapping not verified','configured topology ≠ observed I/O path','neutral']];if(filter!=='All evidence')rows=rows.filter(r=>r[0]===filter);return rows.map(r=>`<div class="evidence"><span>${t(r[0],r[3])}</span><div><strong>${r[1]}</strong><small>${r[2]}</small></div></div>`).join('')||'<div class="drawer-empty">선택한 증거가 없습니다.</div>'}
function pageOverview(){const p=sampleProfiles[state.run];const k=grid('g4',[metric('Step / Update time',p.time.toFixed(1),'s','+64.3%','vs comparable baseline','warn'),metric('Reward · mean',p.reward.toFixed(3),'','reported','completed snapshot'),metric('Worker throughput',p.throughput,'tokens/s/GPU','reported','framework scope'),metric('Reported rollout',p.rollout.toFixed(1),'s','','completed stage')]);const k2=grid('g4',[metric('GPU utilization','81','%','sampled','gpu-1 · shared'),metric('KV prefix token hit','68','%','','native engine'),metric('3FS latency','4.8','ms','reported p99 max','shared service','warn'),metric('Recorded span errors','2','','5,000 cap','known status only','bad')]);return header('Run Overview','한 번에 진행 상황을 파악하고, 느린 Step을 선택해 조사로 이동합니다.','01 / OBSERVE',goBtn('investigate','Investigate selected step →',true))+banner(`<b>Observation boundary:</b> Training 값은 완료 snapshot, GPU·vLLM·3FS 값은 공유 자원/서비스의 같은 시간대 관측입니다. 값이 함께 증가했다고 특정 Run의 I/O라고 결론짓지 않습니다.`)+`${k}<div style="height:13px"></div>${k2}<div style="height:14px"></div>`+grid('g73',[linePanel('Step duration & baseline','Completed step history · reported seconds',[{name:'Reported duration',color:palette.blue,values:points(13,3)},{name:'Baseline median',color:palette.slate,values:Array.from({length:24},()=>11.2)}],'s'),panel('Recent Events','EventRecorder · stored events',eventList())])+`<div class="sectiontitle"><h2>Follow the investigation</h2><small>Choose a completed Step or inspect related resource context</small></div>`+grid('g64',[panel('Completed Steps','Click Duration to investigate · Step/stage to Timeline',stepsTable(),{action:goBtn('timeline','Timeline →')}),panel('Related Metrics','Selected time window · scope preserved',bars([{name:'vLLM waiting · shared engine',value:'23 req',percent:66,tone:'amber'},{name:'GPU memory used · gpu-1',value:'67%',percent:67},{name:'Storage device busy · ds-0',value:'76%',percent:76,tone:'amber'},{name:'RDMA tx wait · port 1',value:'N/A',percent:0}])+`<div style="margin-top:19px">${goBtn('signals','All subsystem signals →')}</div>`)] )+fullCatalog('Overview',['MFU (reported stage)','Policy version (trainer / applied)','Wrapped command status','Snapshot age','Worker completed step IDs','Reward history','GPU memory sampled','KV offload signals','Recent recorded events','Related Metrics / system signals'])+shellNote()}
function pageAnalyze(){return header('Analyze · Phase × Subsystem','실행 Phase와 서브시스템의 관측값을 함께 보고, 관련 후보가 있는 영역을 좁힙니다.','02 / ANALYZE',goBtn('investigate','Open candidate →',true))+banner(`<b>Precision first:</b> Phase cell은 실제 span boundary가 있고 node/clock 조건이 맞는 경우에만 값을 표시합니다. Shared / Rolling / Step evidence를 정확한 Phase 사용량으로 취급하지 않습니다.`)+grid('g3',[metric('Measured phases','4','of 6','','recorded spans'),metric('Worker comparison','4','rollout workers','','matched cohort only'),metric('Clock quality','Aligned','','synthetic injected','real machines TBD')])+`<div style="height:15px"></div>`+panel('Phase × Subsystem Matrix','Click a cell to review the available evidence; N/A is not measured zero',`<div class="tabs" style="margin-bottom:11px">${['Matrix','Worker comparison'].map(x=>`<button class="tab ${state.analyzeView===x?'active':''}" data-analyze-tab="${x}">${x}</button>`).join('')}</div><div id="analyze-matrix-body">${matrixBody()}</div>`)+`<div class="sectiontitle"><h2>Context beyond a single phase</h2></div>`+grid('g64',[panel('System Pressure · shared or sampled','Prioritized entities in selected time range',grid('g2',[metric('vLLM queue','23','waiting','','engine=llama-1'),metric('GPU utilization','81','%','','gpu-1 sampled'),metric('RDMA transmit wait','N/A','','','source not available'),metric('Sandbox I/O PSI','0.20','ratio','','declared worker cgroup')]) ),panel('Top Changes / evidence','Current step relative to comparable baseline',`<div class="stacked">${[['3FS service latency','+84%','warn'],['Step duration','+64%','warn'],['GPU utilization','−12%',''],['Mooncake DFS batch','N/A','']].map(r=>`<div class="kvrow"><span>${r[0]}</span>${t(r[1],r[2])}</div>`).join('')}</div><div class="notice" style="margin-top:16px">Comparable workload fingerprint and entity/clock checks are required before showing phase deltas.</div>`)])+fullCatalog('Analyze',['Phase × Subsystem matrix','Worker comparison / stragglers','System pressure','Current vs baseline gauge eligibility','Rollout replica coverage','Router/serving lifecycle','Recorded policy application','Separate Async next-update decision','Top changes / outlier snapshots'])+shellNote()}
function matrixBody(){if(state.analyzeView==='Worker comparison')return table(['Rollout worker','Node / Engine','Call duration','Peer median','State'],[{cells:['worker-0','gpu-0 / llama-0','5.2 s','5.15 s',t('Comparable','good')]},{cells:['worker-1','gpu-1 / llama-1','18.0 s','5.15 s',t('Outlier candidate','warn')]},{cells:['worker-2','gpu-0 / llama-0','5.1 s','5.15 s',t('Comparable','good')]},{cells:['worker-3','gpu-1 / llama-1','5.2 s','5.15 s',t('Comparable','good')]}]);const phases=['Rollout','Tool','Reward','Actor update','Weight sync','Checkpoint'];const values=[['GPU','81%|good','36%|','N/A|empty','78%|good','82%|','44%|'],['vLLM','23 waiting|warn','Shared|empty','N/A|empty','N/A|empty','N/A|empty','N/A|empty'],['Mooncake / KV','p95 19ms|warn','Rolling|empty','N/A|empty','N/A|empty','N/A|empty','N/A|empty'],['Ray','2 pending|','Shared|empty','N/A|empty','3 pending|','N/A|empty','N/A|empty'],['Network / RDMA','9 GB/s|','Shared|empty','N/A|empty','6 GB/s|','5 GB/s|','Shared|empty'],['Storage','Step evidence|warn','Rolling|empty','N/A|empty','N/A|empty','N/A|empty','Step evidence|warn'],['Sandbox','N/A|empty','0.2 PSI|warn','N/A|empty','N/A|empty','N/A|empty','N/A|empty']];return `<div class="tablewrap"><table class="matrix"><thead><tr><th>Subsystem</th>${phases.map(x=>`<th>${x}<div class="tiny" style="margin-top:2px">recorded / reported</div></th>`).join('')}</tr></thead><tbody>${values.map(r=>`<tr><th>${r[0]}</th>${r.slice(1).map(x=>{let [v,c]=x.split('|');return `<td><button class="matrix-cell ${c}" data-matrix="${r[0]}">${v}<small>${v.startsWith('Step')?'full Step scope':v==='Shared'?'shared service':v==='N/A'?'unavailable':'sampled / rolling'}</small></button></td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="footnote" style="padding-bottom:0">Color denotes which values warrant review in this example, not a causal verdict. A blank interval is never fabricated from stage duration.</div>`}
function pageInvestigate(){return header('Investigate','Current / baseline 비교부터 지지·반박·누락 증거까지 한 화면에서 살펴봅니다.','03 / DIAGNOSE',goBtn('deep','Open Deep Dive →',true))+banner(`<b>Candidate, not verdict.</b> Confidence labels are not causal probabilities. The 3FS evidence below is a shared-service report, not the selected Run's exclusive storage request.`,'warn')+grid('g3',[metric('Current step','18.4','s','+64.3%','completed reported','warn'),metric('Comparable baseline','11.2','s','','matched prior steps'),metric('Evidence quality','Partial','','missing I/O path','not an attribution')])+`<div style="height:15px"></div>`+grid('g37',[panel('Bottleneck candidates','Ranked for investigation; not root-cause verdict',`<div class="entity-row active"><div style="flex:1"><strong>Storage queue / service pressure</strong><small>Candidate · shared storage · supporting only</small></div>${t('Supporting','warn')}</div><div class="entity-row"><div style="flex:1"><strong>GPU starvation</strong><small>Counter and missing entity evidence</small></div>${t('Limited')}</div><div class="entity-row"><div style="flex:1"><strong>Rollout replica outlier</strong><small>Measured worker cohort; routing unverified</small></div>${t('Review')}</div><div class="notice" style="margin-top:13px">Candidate ID / scope와 미충족 조건은 선택된 Step과 함께 보존해야 합니다.</div>`),panel('What changed?','Comparable observation · same entity / producer / time window',`<div class="compare"><div class="c"><small>Current</small><strong>18.4 s</strong><span class="tiny">selected step</span></div><div class="c"><small>Baseline</small><strong>11.2 s</strong><span class="tiny">matched window</span></div><div class="c"><small>Change</small><strong style="color:var(--amber)">+64.3%</strong><span class="tiny">step duration</span></div></div><div style="margin-top:13px">${graph('Current and baseline',[{name:'Current',color:palette.blue,values:points(13,3)},{name:'Baseline',color:palette.slate,values:Array.from({length:24},()=>11.2)}],'s',{H:175})}</div>`)] )+`<div class="sectiontitle"><h2>Review evidence</h2><small>Storage queue/service candidate · selected scope: shared service</small></div>`+grid('g64',[panel('Supporting / Counter / Missing','Every observation keeps producer, unit, timestamp, scope',`<div class="tabs" id="evidence-tabs" style="margin-bottom:12px">${['All evidence','Supporting','Counter','Missing'].map(x=>`<button class="tab ${state.evidenceTab===x?'active':''}" data-evidence="${x}">${x}</button>`).join('')}</div><div id="evidence-items">${evidenceItems(state.evidenceTab)}</div>`),panel('Related timeline','Workload phases and shared metrics are not one causal path',timelineMarkup()+`<div style="margin-top:14px">${goBtn('timeline','Explore full Timeline →')}</div>`)] )+fullCatalog('Investigate',['Comparable workload baseline','Signal source provenance','Supporting / Counter / Missing evidence','Diagnosis query coverage','Clock / timestamp quality','Candidate scopes and limitations','Storage resource relation unknown','Selected entity drill-down'])+shellNote()}

function pageStage(){return header('Agent RL Stage Correlation','완료 Phase, vLLM engine, Ray orchestration, Mooncake, Sandbox를 함께 비교합니다.','SUBSYSTEM / TRAINING',goBtn('analyze','Analyze phase matrix →'))+banner(`<b>VERL source:</b> Completed stage duration은 reported scalar입니다. vLLM queue, Ray states, Mooncake DFS는 각각 다른 shared source이며 step-exclusive latency로 해석하지 않습니다.`)+grid('g4',[metric('Completed step','127','','','trainer driver'),metric('Rollout duration','8.4','s','','reported stage'),metric('vLLM waiting','23','req','','engine llama-1'),metric('Policy version','18','','','trainer reported')])+`<div style="height:14px"></div>`+grid('g2',[linePanel('RL stage duration','Rollout / update / reward · reported at completion',[{name:'Rollout',color:palette.blue,values:points(8.4,1)},{name:'Actor update',color:palette.teal,values:points(4.1,2)},{name:'Tool',color:palette.amber,values:points(1.9,4)}],'s'),linePanel('vLLM serving · latency','Same engine / model scope required',[{name:'TTFT p95',color:palette.blue,values:points(1.8,2)},{name:'Queue p95',color:palette.amber,values:points(2.7,3)}],'s')])+grid('g3',[panel('vLLM engine signals','KV usage, waiting, preemption',bars([{name:'GPU KV cache usage',value:'72%',percent:72},{name:'Waiting requests',value:'23',percent:68,tone:'amber'},{name:'Token prefix hit',value:'68%',percent:68}])),panel('Ray orchestration','Task / actor / object store / logical resources',bars([{name:'Pending tasks',value:'7',percent:45},{name:'Object store occupancy',value:'61%',percent:61},{name:'Placement group',value:'N/A',percent:0}])),panel('Mooncake / KV storage','Connector RPC / master / DFS client',bars([{name:'DFS read bytes',value:'1.2 GB/s',percent:48},{name:'Master cache use',value:'64%',percent:64},{name:'DFS failures',value:'N/A',percent:0}]))])+panel('Sandbox lifecycle · optional','Local / dedicated explicit cgroup / lifecycle only',table(['Signal','Sample value','Scope / interpretation'],[{cells:['Worker I/O PSI','0.20','declared function pageCompute(){return header('Compute & Communication','GPU, Host pressure, NIC/RDMA, DCGM(선택)을 관측하고 관련 자원으로 이동합니다.','SUBSYSTEM / COMPUTE',goBtn('infra','Locate in topology →'))+banner(`<b>Resource scope:</b> GPU/DCGM은 device, host pressure는 node, NIC/RDMA는 interface/port 단위입니다. 이 수치만으로 Run 또는 communication endpoint pair의 전송량을 산정할 수 없습니다.`)+grid('g4',[metric('GPU util · gpu-1','81','%','','sampled device'),metric('GPU memory used','67','%','','device memory'),metric('Host CPU busy','46','%','','gpu-0 node'),metric('RDMA throughput','8.4','GB/s','','port · shared')])+`<div style="height:14px"></div>`+grid('g2',[linePanel('GPU utilization · by device','GPU sampler / native DCGM are distinct sources',[{name:'GPU 0',color:palette.blue,values:points(77,2)},{name:'GPU 1',color:palette.teal,values:points(64,5)}],'%'),linePanel('Ethernet / RDMA throughput','Interface / port · no inferred endpoint linkage',[{name:'RX',color:palette.blue,values:points(8.4,2)},{name:'TX',color:palette.teal,values:points(6.2,4)}],'GB/s')])+grid('g3',[panel('GPU memory and allocation','Physical memory vs explicitly recorded process metrics',bars([{name:'GPU 0 memory',value:'71%',percent:71},{name:'GPU 1 memory',value:'67%',percent:67},{name:'Device process memory',value:'N/A',percent:0}])),panel('Host pressure','CPU / memory / PSI / major faults',bars([{name:'CPU busy',value:'46%',percent:46},{name:'Memory used',value:'58%',percent:58},{name:'CPU PSI some',value:'0.12',percent:12}])),panel('Network error / backpressure','Retransmit, discards, recovery',table(['Signal','Value'],[{cells:['TCP retransmit','0.2/s']},{cells:['RDMA link recovery',t('0 · measured','good')]},{cells:['Port discards',t('N/A','neutral')]}]))])+fullCatalog('Compute & Communication',['GPU allocation matrix','Process GPU memory','GPU temperature / power / clocks','NCCL-related resource context','Host runnable/blocked/steal','Memory pressure / OOM','Network interface errors/drops','TCP retransmits','RDMA transmit wait / link recovery','DCGM SM / DRAM / PCIe activity','DCGM XID / thermal violation','Topology resource filter'])+shellNote()}
function pageStorage(){return header('Data & Storage','Storage Cluster Inventory와 실제 node/device I/O, filesystem, backend collection evidence를 분리해 봅니다.','SUBSYSTEM / STORAGE',goBtn('infra','View topology →'))+banner(`<b>Storage observability:</b> MDS/DS mapping은 선언된 배치이며 device I/O는 해당 host/SSD 전체 값입니다. 3FS reported p99와 local mean latency는 통계 단위가 다릅니다. SMART panel은 없습니다.`)+grid('g4',[metric('Storage nodes','3','declared','','MDS 1 · DS 2'),metric('SSD read / write','7.8','GB/s','','ds-0 host · sample'),metric('Disk mean latency','2.2','ms','','not p99'),metric('3FS service p99 max','4.8','ms','','producer report')])+`<div style="height:14px"></div>`+grid('g2',[linePanel('Storage node I/O bandwidth','Node exporter diskstats · summed devices only when explicit',[{name:'Read',color:palette.blue,values:points(4.6,2)},{name:'Write',color:palette.teal,values:points(3.2,4)}],'GB/s'),linePanel('Local device mean latency & queue','Block device scope, not 3FS service latency',[{name:'Disk mean latency',color:palette.blue,values:points(2.2,1)},{name:'Weighted queue',color:palette.amber,values:points(3.1,3)}],'ms / queue')])+grid('g64',[panel('Storage Cluster Overview · resource nodes','DS/MDS role is declared, collector status is observed',table(['Component','Resource node','Device','Read / Write','Collector'],[{cells:['MDS-0','mds-0','—','—',t('Available','good')]},{cells:['DS-0','ds-0','nvme0n1','4.6 / 3.2 GB/s',t('Available','good')]},{cells:['DS-1','ds-1','nvme1n1',t('No data'),t('Stale','warn')]}])),panel('Filesystem pressure','Mount-level, not request latency',bars([{name:'Filesystem used',value:'58%',percent:58},{name:'Available inode ratio',value:'87%',percent:87},{name:'Dirty / writeback',value:'N/A',percent:0}])+`<div style="margin-top:17px">${goBtn('deep','3FS / Mooncake Deep Dive →')}</div>`)] )+panel('3FS service · collection evidence','Optional ClickHouse · reported timestamp and identity, not exact global request p99',table(['Metric','Reported statistic','Scope','Completeness'],[{cells:['storage_client.overall_latency','p99 max · 4.8 ms','producer/entity',t('Reported','neutral')]},{cells:['storage_client.data_payload_bytes','raw reset report','producer',t('Unknown cadence','warn')]},{cells:['storage_client.num_completed_ops','raw reset report','producer',t('Unknown cadence','warn')]}]))+fullCatalog('Data & Storage',['Declared DS / MDS / SSD inventory','Storage node CPU & memory','Network/RDMA resource pressure','Disk throughput / IOPS','Device mean read / write / flush latency','Device outstanding / weighted queue','Filesystem capacity / inode','Read-only / stat errors','Dirty / writeback','3FS collection time series','Mooncake DFS client metrics','pNFS Deep Dive TBD','No SSD SMART exporter'])+shellNote()}
function pageSignals(){return header('Cross-Layer Signals','Workload/serving과 shared hardware signals를 나란히 비교합니다.','CROSS-LAYER / RESOURCE',goBtn('investigate','Investigate candidate →'))+banner(`<b>Related, not attributed:</b> 각 그래프는 자신의 producer, node/engine/device 단위를 유지합니다. 다른 scope의 신호를 임의 평균하거나 Run 소유량으로 묶지 않습니다.`)+grid('g4',[metric('vLLM waiting','23','req','','shared engine'),metric('GPU utilization','81','%','','gpu-1 device'),metric('Storage busy','76','%','','ds-0 / nvme'),metric('Sandbox PSI','0.20','ratio','','worker cgroup')])+`<div style="height:14px"></div>`+grid('g2',[linePanel('Serving · queue / KV','Native engine scope',[{name:'Waiting requests',color:palette.blue,values:points(21,2)}],'requests'),linePanel('Compute · GPU memory and utilization','Node/device · shared resource',[{name:'GPU memory %',color:palette.violet,values:points(67,2)},{name:'GPU util %',color:palette.teal,values:points(74,3)}],'%'),linePanel('Network · NIC traffic','Interface scope; not per-Run NCCL',[{name:'RX',color:palette.blue,values:points(8.2,1)},{name:'TX',color:palette.cyan,values:points(6.8,3)}],'GB/s'),linePanel('Storage · local device pressure','Device I/O; separate from service p99',[{name:'Busy %',color:palette.amber,values:points(71,2)},{name:'Queue depth',color:palette.slate,values:points(12,5)}],'% / ops')])+grid('g2',[panel('Sandbox signals (optional)','Directly managed worker cgroup, not remote provider',bars([{name:'I/O pressure',value:'0.20',percent:20,tone:'amber'},{name:'Memory used',value:'62%',percent:62},{name:'CPU used',value:'41%',percent:41}])),panel('Source & interpretation guide','Observe → Correlate → Diagnose',table(['Layer','Source','Scope'],[{cells:['Training','VERL logger','Run / worker']},{cells:['Serving','vLLM native','Engine']},{cells:['KV storage','Mooncake','Client / master']},{cells:['3FS','ClickHouse','Shared service']},{cells:['Host / SSD','Node exporter','Node / device']}]))])+fullCatalog('Cross-Layer Signals',['Workload throughput / duration','vLLM queue and cache','Ray object store / tasks','GPU and memory','Host pressure','Network and RDMA','Local disk I/O top devices','Sandbox optional cgroup','Metric freshness / coverage'])+shellNote()}
function pageSummary(){return header('Bottleneck Summary · Native Dashboard','Current / Baseline / Candidate / Evidence를 Grafana 상세 패널 형식으로 검토합니다.','NATIVE / DIAGNOSIS',goBtn('investigate','Open Investigate workspace →'))+banner(`<b>Native panel contract:</b> Summary는 저장된 진단 projection을 보여 줍니다. 현재 시각의 새 자원 지표를 과거 Step에 연결하지 않고, source clock과 missing 조건을 보존해야 합니다.`)+grid('g3',[metric('Duration / current','18.4','s','+64.3%','completed step','warn'),metric('Duration / baseline','11.2','s','','matched prior step'),metric('Candidate count','3','','','not root causes')])+`<div style="height:14px"></div>`+grid('g2',[panel('What changed?','Stored current, baseline, change and unit',table(['Signal','Current','Baseline','Change','Scope'],[{cells:['Step duration','18.4s','11.2s',t('+64.3%','warn'),'run/worker']},{cells:['3FS latency','4.8ms','2.6ms',t('+84.6%','warn'),'shared service']},{cells:['Storage device busy','76%','59%',t('+17pp','warn'),'node/device']},{cells:['RDMA tx wait',t('N/A'),t('N/A'),'—','interface']} ])),panel('Candidate list','Rule-based · supporting/counter/missing state',`<div class="entity-row active"><div><strong>storage_queue_saturation</strong><small>Storage candidate · limited relation evidence</small></div>${t('Supporting','warn')}</div><div style="height:8px"></div><div class="entity-row"><div><strong>gpu_starvation</strong><small>Missing phase/worker proof</small></div>${t('Insufficient')}</div><div style="height:8px"></div><div class="entity-row"><div><strong>straggler</strong><small>One rollout worker slower than peer cohort</small></div>${t('Review')}</div>`)] )+panel('Evidence ledger','What supports, contradicts, or is still unknown',grid('g2',[`<div>${evidenceItems('Supporting')}${evidenceItems('Counter')}</div>`,`<div>${evidenceItems('Missing')}</div>`]))+fullCatalog('Bottleneck Summary',['Current / baseline comparison','Candidate rule ID and signal states','Entity / unit / scope','Supporting / counter / missing evidence','Query execution budget','Clock verification state','Baseline comparability','Source and collection coverage'])+shellNote()}
const RENDER={overview:pageOverview,analyze:pageAnalyze,investigate:pageInvestigate,timeline:pageTimeline,deep:pageDeep,infra:pageInfra,logs:pageLogs,start:pageStart,stage:pageStage,compute:pageCompute,storage:pageStorage,signals:pageSignals,summary:pageSummary};
function buildNav(){document.getElementById('side-nav').innerHTML=NAV.map((g,i)=>`<div class="navcat">${g.title}</div><nav class="navgroup">${g.items.map(([id,label])=>`<button class="navitem ${id===state.page?'active':''}" data-go="${id}" aria-current="${id===state.page?'page':'false'}">${icon(id)}<span>${label}</span>${id==='infra'?'<span class="navnum">NEW</span>':''}</button>`).join('')}</nav>`).join('')}
function render(){buildNav();document.getElementById('page').innerHTML=(RENDER[state.page]||pageOverview)();const found=NAV.flatMap(g=>g.items).find(x=>x[0]===state.page);document.getElementById('crumb-name').textContent=found?found[1]:'Overview';document.getElementById('sidebar').classList.remove('open');document.title=`${found?.[1]||'Overview'} · XLayer Telemetry Design Preview`;sync();}
function sync(){['cluster','run','step','node','time'].forEach(name=>{let el=document.getElementById(name+'-select');if(el)el.value=state[name]});}
function navigate(id){state.page=id;window.location.hash=id;render();window.scrollTo({top:0,behavior:'instant'});}
function openNotes(){document.getElementById('modal-root').innerHTML=`<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Design notes"><div class="eyebrow">DESIGN RATIONALE</div><h2>One coherent XLayer dashboard</h2><p>현재 Grafana App + Native Dashboard 기능을 하나의 시각적 언어로 묶은 <b>디자인 탐색용 HTML</b>입니다. 백엔드, 실제 수집, 진단 서비스와 연결되지 않으며 모든 KPI·시간 그래프·로그는 synthetic example입니다.</p><div class="grid g2"><div class="notice"><strong>01 · 더 읽기 쉬운 정보 계층</strong><br>KPI → anomalous step → evidence → source detail의 순서, 정돈된 패널, 11–13px 정보 typography.</div><div class="notice"><strong>02 · 과장 없는 색상</strong><br>Indigo는 실행 지표, Teal은 resource, Amber는 검토 사항. 빨강은 기록된 오류에만 사용.</div><div class="notice"><strong>03 · Scope / provenance</strong><br>Shared GPU/3FS와 Run 지표 분리. Unknown, Missing, Reported를 사라지지 않게 표시.</div><div class="notice"><strong>04 · 이식 경계</strong><br>실제 구현은 기존 Scenes, Grafana UID, Loki, Prometheus, stored diagnosis 및 canonical query 재사용.</div></div><div class="modal-footer"><button class="smallbtn primary" id="close-modal">Close</button></div></div></div>`;document.getElementById('close-modal').onclick=closeNotes;document.getElementById('overlay').onclick=(e)=>{if(e.target.id==='overlay')closeNotes()};}
function closeNotes(){document.getElementById('modal-root').innerHTML=''}
document.addEventListener('click',e=>{const elem=e.target.closest('[data-go]');if(elem){let step=elem.dataset.step;if(step)state.step=step;navigate(elem.dataset.go);return}let topo=e.target.closest('[data-topo]');if(topo){state.selectedNode=topo.dataset.topo;let host=document.getElementById('topo-host'),detail=document.getElementById('infra-detail');if(host)host.innerHTML=topoSvg();if(detail)detail.innerHTML=infraDetail();return}let dt=e.target.closest('[data-detail]');if(dt){state.detailTab=dt.dataset.detail;document.getElementById('deep-tabs').innerHTML=storageSections.map(x=>`<button class="tab ${state.detailTab===x?'active':''}" data-detail="${x}">${x}</button>`).join('');document.getElementById('deep-content').innerHTML=deepContent();return}let tab=e.target.closest('[data-evidence]');if(tab){state.evidenceTab=tab.dataset.evidence;document.getElementById('evidence-tabs').innerHTML=['All evidence','Supporting','Counter','Missing'].map(x=>`<button class="tab ${state.evidenceTab===x?'active':''}" data-evidence="${x}">${x}</button>`).join('');document.getElementById('evidence-items').innerHTML=evidenceItems(state.evidenceTab);return}let anal=e.target.closest('[data-analyze-tab]');if(anal){state.analyzeView=anal.dataset.analyzeTab;document.getElementById('analyze-matrix-body').innerHTML=matrixBody();document.querySelectorAll('[data-analyze-tab]').forEach(btn=>btn.classList.toggle('active',btn.dataset.analyzeTab===state.analyzeView));return}let mat=e.target.closest('[data-matrix]');if(mat){state.evidenceTab='All evidence';navigate('investigate')}});
document.addEventListener('input',e=>{if(e.target.id==='log-search'){state.search=e.target.value;document.getElementById('log-rows').innerHTML=logRows()}});
document.addEventListener('change',e=>{if(e.target.id==='log-level'){state.logLevel=e.target.value;document.getElementById('log-rows').innerHTML=logRows();return}if(e.target.id&&e.target.id.endsWith('-select')){const k=e.target.id.replace('-select','');if(k in state){state[k]=e.target.value;render()}}});
document.getElementById('reset-button').onclick=()=>{Object.assign(state,{run:'demo-llama',step:'127',cluster:'training-poc',node:'All',time:'30m'});render()};document.getElementById('theme-toggle').onclick=()=>{state.dark=!state.dark;document.body.dataset.theme=state.dark?'dark':'light';document.getElementById('theme-toggle').textContent=state.dark?'☀':'☾'};document.getElementById('guide-button').onclick=openNotes;document.getElementById('mobile-toggle').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNotes();if(e.key==='Enter'&&e.target.matches('[data-topo]'))e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))});window.addEventListener('hashchange',()=>{let id=location.hash.replace(/^#/,'');if(RENDER[id]&&id!==state.page){state.page=id;render()}});const start=location.hash.replace(/^#/,'');if(RENDER[start])state.page=start;render();
</script>
