[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlayer-telemetry"
version = "0.1.0"
description = "Collect, correlate, and diagnose telemetry across VERL subsystems"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["xlayer_telemetry*"]
