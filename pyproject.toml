[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlayer-telemetry"
version = "0.1.0"
description = "Workload-aware cross-layer performance diagnosis for distributed AI workloads"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["xlayer_telemetry*"]

[tool.setuptools.package-data]
xlayer_telemetry = ["step_explorer.html"]
